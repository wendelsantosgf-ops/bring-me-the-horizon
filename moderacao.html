<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderação | BMTH</title><link rel="stylesheet" href="./theme.css"><style>
body{background:#0b0a10;color:#f7edf4;font:15px/1.5 system-ui,sans-serif}main{max-width:980px;margin:30px auto;padding:16px}.panel{background:#19121e;border:1px solid #503345;border-radius:12px;padding:22px;margin:18px 0}h1,h2{color:#f5bfd0}label{display:block;margin-top:12px}input,select,textarea{display:block;width:100%;padding:12px;background:#100b14;color:white;border:1px solid #765065;border-radius:6px}button{background:#a92744;color:white;border:0;border-radius:6px;padding:11px 16px;cursor:pointer;margin:10px 8px 0 0}.secondary{background:#483044}.muted{color:#c5aebb}.row{padding:12px 0;border-bottom:1px solid #443143}a{color:#ffacc5}[hidden]{display:none!important}
</style></head><body><main><a href="./admin.html">← Central de Comando</a><h1>Moderação BMTH</h1><p id="status" role="status">Verificando acesso...</p><div id="app" hidden>
<section class="panel" id="staffPanel"><h2>Equipe</h2><label>Membro<select id="staffUser"></select></label><label>Cargo<select id="staffRole"><option value="curator">Curador</option><option value="moderator">Moderador</option></select></label><button id="appoint">Nomear / atualizar</button><button id="dismiss" class="secondary">Remover cargo</button><div id="staffList"></div></section>
<section class="panel"><h2>Aplicar punição</h2><label>Membro<select id="target"></select></label><label>Tipo<select id="kind"><option value="mute">Silenciar</option><option value="ban">Banir</option></select></label><label>Duração<select id="duration"><option value="1">1 dia</option><option value="3">3 dias</option><option value="7">7 dias</option><option value="30">30 dias</option><option value="permanent">Permanente</option></select></label><label>Motivo<textarea id="reason" rows="3" maxlength="1000" placeholder="Descreva o motivo"></textarea></label><button id="punish">Aplicar punição</button><p class="muted">Silenciamento impede novas publicações e comentários no feed. Banimento impede publicações e interações protegidas.</p></section>
<section class="panel" id="postPanel"><h2>Remover postagem</h2><label>ID da postagem<input id="postId" placeholder="UUID da postagem"></label><label>Motivo<input id="postReason" maxlength="1000"></label><button id="removePost">Remover postagem</button></section>
</div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://hfmnoiaiyrchxrxprsav.supabase.co','sb_publishable_0HS5ItAQ76mtGqkEQ387Lw_Adirp2Ml');
const $=id=>document.getElementById(id);const say=s=>$('status').textContent=s;
let level=0,users=[];
async function refresh(){
 const {data:profiles,error}=await db.from('profile').select('user_id,display_name').order('display_name');
 if(error){say(error.message);return}users=(profiles||[]).filter(p=>p.user_id);
 for(const id of ['target','staffUser']){const select=$(id),prev=select.value;select.replaceChildren();for(const p of users){const opt=document.createElement('option');opt.value=p.user_id;opt.textContent=p.display_name||p.user_id;select.append(opt)}if(users.some(p=>p.user_id===prev))select.value=prev}
 const {data:staff}=await db.from('bmth_staff').select('user_id,role');const list=$('staffList');list.replaceChildren();for(const s of staff||[]){const div=document.createElement('div');div.className='row';div.textContent=(users.find(p=>p.user_id===s.user_id)?.display_name||s.user_id)+' — '+(s.role==='moderator'?'Moderador':'Curador');list.append(div)}
}
async function act(name,args){const {error}=await db.rpc(name,args);if(error){say('Erro: '+error.message);return false}say('Operação concluída.');await refresh();return true}
$('appoint').onclick=()=>act('bmth_appoint_staff',{p_user:$('staffUser').value,p_role:$('staffRole').value});
$('dismiss').onclick=()=>act('bmth_remove_staff',{p_user:$('staffUser').value});
$('punish').onclick=async()=>{const reason=$('reason').value.trim();if(reason.length<5){say('Informe um motivo com pelo menos 5 caracteres.');return}const duration=$('duration').value;const expires=duration==='permanent'?null:new Date(Date.now()+Number(duration)*86400000).toISOString();await act('bmth_apply_sanction',{p_user:$('target').value,p_kind:$('kind').value,p_reason:reason,p_expires_at:expires})};
$('removePost').onclick=()=>act('bmth_moderate_post',{p_post:$('postId').value,p_reason:$('postReason').value.trim()});
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){say('Faça login para acessar.');return}const {data,error}=await db.rpc('bmth_staff_level',{p_user:user.id});if(error){say('Execute o SQL de moderação antes de usar esta página.');return}level=data;if(level<1){say('Acesso restrito à equipe.');return}$('app').hidden=false;$('staffPanel').hidden=level<2;$('postPanel').hidden=level<2;if(level<3)$('staffRole').querySelector('option[value="moderator"]').remove();if(level===1)$('kind').querySelector('option[value="ban"]').remove();say('Painel de moderação autorizado.');await refresh()}
init().catch(e=>say(e.message));
</script></body></html>
